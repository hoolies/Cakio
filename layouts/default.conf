# Default camera layout — copy this file, rename it for the site
# (for example layouts/dock.conf), edit the grid and camera lines,
# then push it with:
#   ./kiosk-admin.sh layout ADDRESS layouts/YOUR.conf
#
# Preview on your computer before pushing (needs ffmpeg and a font):
#   ./kiosk-mosaic.sh --test-pattern --snapshot preview.png layouts/default.conf
#
# ---------------------------------------------------------------------------
# File shape
# ---------------------------------------------------------------------------
#   1. Optional settings (one KEY VALUE per line; see below).
#   2. One layout ... end block: the screen as a grid of tile names.
#   3. One camera line per tile name used in the grid.
#
# Lines that start with # are comments. Blank lines are ignored.
# The grid stretches to fill the whole screen, whatever its resolution.
#
# ---------------------------------------------------------------------------
# The grid
# ---------------------------------------------------------------------------
#   - A letter (or word of letters/digits/_) is a tile.
#   - Repeat the same name across cells to make a bigger tile; the shape
#     must be a rectangle.
#   - A lone . is an empty cell (black gap).
#
# Example shapes (not used below):
#
#   Equal 2x2:
#     A B
#     C D
#
#   One tall tile on the left, two stacks on the right:
#     A B C
#     A B D
#     A E D
#     A E F
#
#   One large tile and four small ones:
#     A A B C
#     A A D E
#
# ---------------------------------------------------------------------------
# Camera lines
# ---------------------------------------------------------------------------
#   tile|id|name|address
#   tile|id|name|address|option=value,option=value
#
#   tile     must match a name in the layout block
#   id       camera number shown on the label (may be empty if name is set)
#   name     shown after the id as "id - name" (may be empty)
#   address  camera host name or IP (no URL, no port — use port= below)
#
# Per-camera options (comma-separated after a fifth |):
#   stream=auto|main|sub     which RTSP stream (default: file/global setting)
#   fit=fill|fit|stretch     how this tile crops/letterboxes/stretches
#   port=554                 RTSP port for this camera
#   main_path=/rtsp_tunnel   path for the main stream
#   sub_path=/rtsp_tunnel?inst=2
#                            path for the second (lower-res) stream
#
# Small tiles pick the sub stream automatically when stream is auto.
# Use stream=main on a tile that must stay sharp.
#
# ---------------------------------------------------------------------------
# Optional settings (apply to the whole wall unless a camera overrides)
# ---------------------------------------------------------------------------
#   fps 10                   frames per second (1–60; 10 is plenty for a wall)
#   fit fill                 fill = crop to tile, fit = letterbox, stretch
#   stream auto              auto | main | sub
#   sub_max_height 400       in auto mode, use sub when the tile is this tall
#                            or shorter (pixels)
#   resolution auto          auto (match the screen) or e.g. 1920x1080
#   labels on                on | off — draw "id - name" in the tile corner
#   label_size auto          auto, or a pixel size from 6 to 300
#   port 554                 default RTSP port
#   main_path /rtsp_tunnel   Bosch main stream (change if your cameras differ)
#   sub_path /rtsp_tunnel?inst=2
#
# Command-line options to kiosk-mosaic.sh override anything in this file.
#
# ---------------------------------------------------------------------------
# Starter wall — replace the addresses (and names) with yours
# ---------------------------------------------------------------------------

fps 10
fit fill
stream auto

layout
A B
C D
end

# tile|id|name|address[|options]
A|1001|Entrance|192.0.2.11
B|1002|Yard|192.0.2.12
C|1003|Parking|192.0.2.13
D|1004|Dock|192.0.2.14|stream=main,fit=fit

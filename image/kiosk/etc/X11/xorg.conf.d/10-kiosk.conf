# X server settings for the camera kiosk.
#
# No input devices are added, so the keyboard and mouse do nothing. The
# screen never blanks or powers down, and the console cannot be switched
# or the server killed from the keyboard.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AllowEmptyInput" "true"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
